name: ci
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Format check and tests (embedded PostgreSQL 16)
        run: ./gradlew check
      - name: Container image builds
        run: docker build -t conference-ops .
